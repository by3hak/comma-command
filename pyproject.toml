[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comma-command"
version = "0.1.1"
description = "Run any configured command from any shell as `name, args` — register once, invoke everywhere."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hak", email = "by3hak@users.noreply.github.com" }]
keywords = ["cli", "shell", "alias", "dispatch", "multicall", "terminal"]
dependencies = ['tomli>=2.0; python_version < "3.11"']
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/by3hak/comma-command"
Repository = "https://github.com/by3hak/comma-command"
Issues = "https://github.com/by3hak/comma-command/issues"

[project.scripts]
comma = "comma_command.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/comma_command"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
